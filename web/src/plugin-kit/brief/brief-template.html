<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FAFAFA;--paper:#FFFFFF;--soft:#F1F2F5;--rule:#E3E3E4;--ink:#171721;--ink-2:#55555E;--muted:#8E8E92;
  --accent:#447C93;--accent-ink:#2B6178;--accent-bg:#E6EFF3;--scrim:rgba(13,26,51,.38);--shadow:0 12px 40px rgba(13,26,51,.18);
  --critical:#B42318;--critical-bg:#FDECEA;--high:#B54708;--high-bg:#FEF0E1;--medium:#8A6A00;--medium-bg:#FBF3D5;--low:#027A48;--low-bg:#E3F4EC;
  --sans:"KMR Waldenburg",Arimo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --page:#0F1117;--paper:#171A22;--soft:#1F2330;--rule:#2C3140;--ink:#ECEDF0;--ink-2:#B4B6BE;--muted:#8A8D97;
  --accent:#7DACC0;--accent-ink:#99C1D1;--accent-bg:#1B2E37;--scrim:rgba(0,0,0,.55);--shadow:0 12px 40px rgba(0,0,0,.5);
  --critical:#F97066;--critical-bg:#3A1A18;--high:#FDB022;--high-bg:#3A2A12;--medium:#EAC54F;--medium-bg:#332C12;--low:#47CD89;--low-bg:#123026;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header.mast{background:var(--paper);border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;align-items:baseline;gap:16px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.mast h1{margin:0;font:700 22px/1.2 var(--sans);letter-spacing:-.01em}
.mast .org{color:var(--ink-2);font-weight:500}
.mast .updated{margin-left:auto}
.question{margin:18px 0 0;font-size:16px;color:var(--ink-2);max-width:780px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.tile .fig{font:700 26px/1.15 var(--sans);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.tile.lv{border-top:3px solid var(--rule)}
.tile.lv-critical{border-top-color:var(--critical)}.tile.lv-high{border-top-color:var(--high)}.tile.lv-medium{border-top-color:var(--medium)}.tile.lv-low{border-top-color:var(--low)}
.summary{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 18px;margin-top:10px}
.summary ul{margin:6px 0 0;padding-left:18px}.summary li{margin:3px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.sec-head h2{margin:0;font:700 18px/1.2 var(--sans)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip .ct{opacity:.75;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:500 11px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.p-critical{background:var(--critical-bg);color:var(--critical)}.p-high{background:var(--high-bg);color:var(--high)}
.p-medium{background:var(--medium-bg);color:var(--medium)}.p-low{background:var(--low-bg);color:var(--low)}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1.3fr) 96px minmax(0,2.4fr) 110px 110px;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 16px;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row.head{cursor:default;background:var(--soft);padding-top:8px;padding-bottom:8px}
.row .rank{color:var(--muted);font:500 13px/1.5 var(--mono)}
.row .name{font-weight:600;overflow-wrap:anywhere}.row .subt{color:var(--ink-2);font-size:12.5px;font-weight:400}
.row .num{text-align:right;font-variant-numeric:tabular-nums}
.row .date{color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;color:var(--ink-2);text-align:center}
details.scope{margin:22px 0 0;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
details.scope summary{cursor:pointer}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:12px 0 0}
dl.kv dt{color:var(--ink-2)}dl.kv dd{margin:0;overflow-wrap:anywhere}
footer{color:var(--muted);font-size:12px;padding:26px 0 36px}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .18s ease-out;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
aside.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--paper);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .2s ease-out;z-index:30;display:flex;flex-direction:column}
aside.panel.open{transform:none}
aside.panel[hidden]{display:none}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--rule);background:var(--soft)}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-top h2{margin:0;font:700 20px/1.25 var(--sans);flex:1;overflow-wrap:anywhere}
.close{border:1px solid var(--rule);background:var(--paper);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-top:12px}
.facts div{min-width:0}.facts .v{overflow-wrap:anywhere}
.p-body{overflow:auto;padding:6px 20px 28px}
.p-sec{margin-top:18px}
.p-sec > .eyebrow{margin-bottom:8px}
details.f{border:1px solid var(--rule);border-radius:10px;margin-top:8px;background:var(--paper)}
details.f[open]{background:var(--page)}
details.f summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
details.f summary::-webkit-details-marker{display:none}
details.f summary .t{flex:1;min-width:0}
details.f summary .area{font-weight:600}
details.f .inner{padding:0 12px 12px}
.ev{border-left:2px solid var(--rule);padding:2px 0 2px 10px;margin-top:8px}
.ev .meta{font:500 11px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.act{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:8px}
.act .who{color:var(--ink-2);font-size:13px;margin-top:2px}
.act ol{margin:8px 0 0;padding-left:18px}
.muted{color:var(--ink-2)}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .row{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"rank name num" "rank lvl date" "rank head head"}
  .row.head{display:none}
  .row .rank{grid-area:rank}.row .name{grid-area:name}.row .num{grid-area:num}.row .lvlc{grid-area:lvl}.row .date{grid-area:date;text-align:right}.row .hl{grid-area:head;color:var(--ink-2)}
  .mast .updated{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.scrim,aside.panel{transition:none}}
</style>
</head>
<body>
<header class="mast"><div class="wrap" id="mast"></div></header>
<main class="wrap" id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden></aside>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const LEVELS = ["critical", "high", "medium", "low"];
  const LEVEL_NAME = { critical: "Critical", high: "High", medium: "Medium", low: "Low" };
  const app = document.getElementById("app");
  const panel = document.getElementById("panel");
  const scrim = document.getElementById("scrim");

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  }
  if (!DATA) { app.append(h("p", { class: "empty" }, "No data was built into this page.")); return; }

  const meta = DATA.meta || {};
  const computed = DATA.computed || {};
  const items = DATA.items || [];
  const shown = items.filter((it) => (meta.shownLevels || LEVELS).includes(it.level));
  const currency = meta.currency || "USD";
  const money = (v) => (typeof v === "number" ? new Intl.NumberFormat("en-US", { style: "currency", currency, notation: Math.abs(v) >= 10000 ? "compact" : "standard", maximumFractionDigits: Math.abs(v) >= 10000 ? 1 : 0 }).format(v) : "—");
  const fmtDate = (s) => { if (!s) return "—"; const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }); };
  const pill = (level) => h("span", { class: `pill p-${level}` }, LEVEL_NAME[level] || level);
  document.title = [meta.org, meta.title].filter(Boolean).join(" · ") || "Brief";

  document.getElementById("mast").append(
    h("h1", null, meta.org ? h("span", { class: "org" }, `${meta.org} · `) : null, meta.title || "Brief"),
    h("span", { class: "eyebrow updated" }, `Updated ${fmtDate(meta.asOf)}`)
  );

  const state = { group: "", item: "" };
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    state.group = p.get("group") || "";
    state.item = p.get("item") || "";
  }
  function writeHash() {
    const p = new URLSearchParams();
    if (state.group) p.set("group", state.group);
    if (state.item) p.set("item", state.item);
    const next = p.toString();
    if (next !== location.hash.slice(1)) history.replaceState(null, "", next ? `#${next}` : location.pathname + location.search);
  }

  const groups = meta.groupLabel ? [...new Set(shown.map((it) => it.group).filter(Boolean))] : [];
  const hasValue = items.some((it) => typeof it.value === "number");
  const hasDate = items.some((it) => it.date);

  function strip() {
    const tiles = (meta.shownLevels || LEVELS).map((level) => {
      const c = (computed.levels || {})[level] || { count: 0, value: 0 };
      return h("div", { class: `tile lv lv-${level}` }, h("div", { class: "eyebrow" }, LEVEL_NAME[level]), h("div", { class: "fig" }, c.count), hasValue ? h("div", { class: "sub" }, money(c.value)) : null);
    });
    tiles.push(h("div", { class: "tile" }, h("div", { class: "eyebrow" }, "Reviewed"), h("div", { class: "fig" }, computed.reviewed ?? items.length), hasValue ? h("div", { class: "sub" }, `${money(computed.totalValue)} in total`) : null));
    (DATA.metrics || []).forEach((m) => tiles.push(h("div", { class: "tile" }, h("div", { class: "eyebrow" }, m.label), h("div", { class: "fig" }, m.value), m.note ? h("div", { class: "sub" }, m.note) : null)));
    const out = [h("section", { class: "strip", "aria-label": "Totals" }, tiles)];
    if ((DATA.summary || []).length) out.push(h("section", { class: "summary" }, h("div", { class: "eyebrow" }, "In short"), h("ul", null, DATA.summary.map((s) => h("li", null, s)))));
    return out;
  }

  function row(it) {
    return h("button", { class: "row", type: "button", "aria-label": `${it.name}, ${LEVEL_NAME[it.level]}`, onclick: () => openItem(it.id) },
      h("span", { class: "rank" }, it.rank ?? ""),
      h("span", { class: "name" }, it.name, it.subtitle ? h("div", { class: "subt" }, it.subtitle) : null),
      h("span", { class: "lvlc" }, pill(it.level)),
      h("span", { class: "hl" }, it.headline || ""),
      h("span", { class: "date" }, hasDate ? fmtDate(it.date) : ""),
      h("span", { class: "num" }, hasValue ? money(it.value) : ""));
  }

  function render() {
    app.textContent = "";
    if (meta.question) app.append(h("p", { class: "question" }, meta.question));
    app.append(...strip());
    const visible = shown.filter((it) => !state.group || it.group === state.group);
    const head = h("div", { class: "sec-head" }, h("h2", null, meta.listTitle || "Where to act"), h("span", { class: "eyebrow" }, `${visible.length} of ${computed.reviewed ?? items.length} reviewed`));
    app.append(head);
    if (groups.length > 1) {
      const chip = (value, label, count) => h("button", { class: "chip", type: "button", "aria-pressed": String(state.group === value), onclick: () => { state.group = value; writeHash(); render(); } }, label, h("span", { class: "ct" }, count));
      app.append(h("div", { class: "filters", role: "group", "aria-label": meta.groupLabel }, chip("", "All", shown.length), groups.map((g) => chip(g, g, shown.filter((it) => it.group === g).length))));
    }
    const list = h("div", { class: "list" });
    if (visible.length) {
      list.append(h("div", { class: "row head", "aria-hidden": "true" }, h("span", { class: "eyebrow" }, "#"), h("span", { class: "eyebrow" }, "Name"), h("span", { class: "eyebrow" }, "Level"), h("span", { class: "eyebrow" }, "Why it's here"), h("span", { class: "eyebrow" }, hasDate ? meta.dateLabel || "Date" : ""), h("span", { class: "eyebrow num" }, hasValue ? meta.valueLabel || "Value" : "")));
      visible.forEach((it) => list.append(row(it)));
    } else {
      list.append(h("p", { class: "empty" }, `Nothing at these levels${state.group ? ` in ${state.group}` : ""}. ${computed.reviewed ?? items.length} reviewed.`));
    }
    app.append(list);
    const scope = meta.scope || [];
    const sources = meta.sources || [];
    if (scope.length || sources.length) {
      app.append(h("details", { class: "scope" }, h("summary", null, h("span", { class: "eyebrow" }, "Scope of this brief")),
        h("dl", { class: "kv" }, scope.map((s) => [h("dt", null, s.label), h("dd", null, s.value)]), sources.length ? [h("dt", null, "Sources"), h("dd", null, sources.join(", "))] : null)));
    }
    app.append(h("footer", null, `Insights from Backstory · ${meta.title || "Brief"}${computed.version ? ` v${computed.version}` : ""} · built ${computed.builtAt || ""}`));
  }

  let lastFocus = null;
  function openItem(id) {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    lastFocus = document.activeElement;
    state.item = id; writeHash();
    panel.textContent = "";
    const facts = [];
    if (it.date) facts.push([meta.dateLabel || "Date", fmtDate(it.date)]);
    if (typeof it.value === "number") facts.push([meta.valueLabel || "Value", money(it.value)]);
    if (it.group) facts.push([meta.groupLabel || "Group", it.group]);
    (it.facts || []).forEach((f) => facts.push([f.label, f.value]));
    const closeBtn = h("button", { class: "close", type: "button", "aria-label": "Close", onclick: closePanel }, "»");
    panel.append(h("div", { class: "p-head" },
      h("div", { class: "p-top" }, h("h2", { id: "p-title" }, it.name), pill(it.level), closeBtn),
      it.subtitle ? h("div", { class: "muted" }, it.subtitle) : null,
      h("div", { class: "facts" }, facts.map(([k, v]) => h("div", null, h("div", { class: "eyebrow" }, k), h("div", { class: "v" }, v))))));
    const body = h("div", { class: "p-body" });
    if (it.assessment) body.append(h("section", { class: "p-sec" }, h("div", { class: "eyebrow" }, "Assessment"), h("p", { style: "margin:0" }, it.assessment)));
    if ((it.findings || []).length) {
      body.append(h("section", { class: "p-sec" }, h("div", { class: "eyebrow" }, "What we found"),
        it.findings.map((f) => h("details", { class: "f" },
          h("summary", null, h("span", { class: "t" }, h("div", { class: "area" }, f.area), h("div", { class: "muted" }, f.finding)), pill(f.status)),
          h("div", { class: "inner" }, (f.evidence || []).length ? f.evidence.map((e) => h("div", { class: "ev" }, h("div", { class: "meta" }, [fmtDate(e.date), e.kind, e.source].filter(Boolean).join(" · ")), h("div", null, e.text))) : h("div", { class: "muted" }, f.explanation || "No single event behind this; see the finding."))))));
    }
    if ((it.actions || []).length) {
      body.append(h("section", { class: "p-sec" }, h("div", { class: "eyebrow" }, "What to do"),
        it.actions.map((a) => h("div", { class: "act" }, h("div", { style: "font-weight:600" }, a.title), h("div", { class: "who" }, `${a.who} · by ${fmtDate(a.by)}`), a.why ? h("p", { style: "margin:6px 0 0" }, a.why) : null, (a.steps || []).length ? h("ol", null, a.steps.map((s) => h("li", null, s))) : null))));
    }
    panel.append(body);
    panel.hidden = false;
    requestAnimationFrame(() => { panel.classList.add("open"); scrim.classList.add("open"); closeBtn.focus(); });
  }
  function closePanel() {
    panel.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { panel.hidden = true; }, 200);
    state.item = ""; writeHash();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  scrim.addEventListener("click", closePanel);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) closePanel(); });

  readHash();
  if (state.group && !groups.includes(state.group)) state.group = "";
  render();
  if (state.item) openItem(state.item);
})();
</script>
</body>
</html>
